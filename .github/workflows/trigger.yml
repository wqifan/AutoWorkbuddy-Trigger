name: 触发 Buddy 加油站每日签到

# 每小时的 07 / 17 / 37 / 47 分各试一次。
# 为什么不集中在一分钟：GitHub 的调度器在整点前后负载最高，
# 分散到多个点能让每个点被独立投递，任意一次成功即可。
# 四个点都失败也不要紧 —— 本机的 Windows 计划任务是另一条独立通路。
on:
  schedule:
    - cron: '7,17,37,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 调用私有仓库的 workflow_dispatch
        env:
          GH_PAT: ${{ secrets.TRIGGER_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "缺少 secrets.TRIGGER_PAT，跳过"
            exit 0
          fi
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"mode":"run","push":"auto"}}' \
            "https://api.github.com/repos/wqifan/AutoWorkbuddy/actions/workflows/daily.yml/dispatches")
          echo "dispatch HTTP $code"
          head -c 400 /tmp/out.txt; echo
          if [ "$code" != "204" ]; then
            echo "触发失败（期望 204）"
            exit 1
          fi
